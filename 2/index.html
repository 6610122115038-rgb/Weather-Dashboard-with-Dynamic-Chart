<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance Tracker - Intern Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
    
    <!-- Left Column: Form -->
    <div class="md:col-span-1 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 h-fit">
      <h2 class="text-xl font-bold mb-4 text-emerald-400">บันทึกรายการ</h2>
      <form id="txForm" onsubmit="addTransaction(event)" class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">ชื่อรายการ</label>
          <input type="text" id="desc" required placeholder="เช่น ค่าข้าว, เงินเดือน" 
            class="w-full px-3 py-2 bg-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">จำนวนเงิน (บาท)</label>
          <input type="number" id="amount" required placeholder="0.00" step="any"
            class="w-full px-3 py-2 bg-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">ประเภท</label>
          <select id="type" class="w-full px-3 py-2 bg-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="expense">รายจ่าย</option>
            <option value="income">รายรับ</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-lg font-semibold transition">
          + เพิ่มรายการ
        </button>
      </form>
    </div>

    <!-- Right Column: Dashboard & History -->
    <div class="md:col-span-2 space-y-6">
      
      <!-- Summary Cards -->
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
          <p class="text-xs text-slate-400">รายรับทั้งหมด</p>
          <p id="totalIncome" class="text-lg font-bold text-emerald-400">฿0</p>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
          <p class="text-xs text-slate-400">รายจ่ายทั้งหมด</p>
          <p id="totalExpense" class="text-lg font-bold text-rose-400">฿0</p>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
          <p class="text-xs text-slate-400">คงเหลือ</p>
          <p id="netBalance" class="text-lg font-bold text-blue-400">฿0</p>
        </div>
      </div>

      <!-- Chart & List Container -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 bg-slate-800 p-6 rounded-2xl border border-slate-700">
        <div class="relative h-48 flex items-center justify-center">
          <canvas id="financeChart"></canvas>
        </div>
        <div>
          <h3 class="text-lg font-semibold mb-3 text-slate-300">ประวัติรายการ</h3>
          <ul id="txList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></ul>
        </div>
      </div>

    </div>
  </div>

  <script src="js.js"></script>
</body>
</html>
